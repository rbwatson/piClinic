openapi: 3.0.0
info:
  title: 'piClinic API'
  description: 'REST API for the piClinic clinic information system (v2.0). All endpoints except POST /auth/login require a valid session token supplied via the X-Session-Token header or the piclinic_session cookie.'
  license:
    name: MIT
  version: 2.0.0
servers:
  -
    url: /api/v2
    description: 'piClinic v2 API'
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 'Create a new session (login)'
      operationId: 49e1326014cf452096c9618297240562
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: jsmith
                password:
                  type: string
                  format: password
              type: object
      responses:
        '201':
          description: 'Session created'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Session' }
                type: object
        '400':
          description: 'Missing credentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Invalid credentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/session:
    get:
      tags:
        - Auth
      summary: 'Validate the current session'
      operationId: 2f5ed47b849e3809deb6fb5c9915b62b
      responses:
        '200':
          description: 'Session is valid'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Session' }
                type: object
        '401':
          description: 'Session invalid or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 'Terminate the current session (logout)'
      operationId: a0da5404687fe24323138016dc6d6c4e
      responses:
        '200':
          description: 'Logged out'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { example: null, nullable: true }
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 'Extend the current session expiry'
      operationId: fe949978d5935df53e32ba5a069586f6
      responses:
        '200':
          description: 'Session refreshed'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Session' }
                type: object
        '401':
          description: 'Session invalid or expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /clinic:
    get:
      tags:
        - Clinic
      summary: 'Search for clinic records'
      description: 'GET /api/v2/clinic[?thisClinic=1|publicID=...|shortName=...]'
      operationId: bf8817e115753b90c317a3f0e7b9e420
      parameters:
        -
          name: thisClinic
          in: query
          description: 'Return the local clinic record (value: 1)'
          schema:
            type: string
            enum:
              - '1'
        -
          name: publicID
          in: query
          description: 'Filter by public ID'
          schema:
            type: string
        -
          name: shortName
          in: query
          description: 'Filter by short name'
          schema:
            type: string
      responses:
        '200':
          description: 'List of matching clinics'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clinic'
        '400':
          description: 'No valid search parameter provided'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /icd:
    get:
      tags:
        - ICD
      summary: 'Search ICD-10 codes'
      description: 'GET /api/v2/icd[?q=...&t=...&c=...&language=...&sort=...]'
      operationId: 97e4cfebf0b10eb07c255bd4177fb023
      parameters:
        -
          name: q
          in: query
          description: 'Search code or description text'
          schema:
            type: string
        -
          name: t
          in: query
          description: 'Search description text only'
          schema:
            type: string
        -
          name: c
          in: query
          description: 'Search by code prefix'
          schema:
            type: string
        -
          name: language
          in: query
          description: 'Language for descriptions (default en)'
          schema:
            type: string
            default: en
            enum:
              - en
              - es
        -
          name: sort
          in: query
          description: 'Sort field: c=code, t=description, d=last used date'
          schema:
            type: string
            enum:
              - c
              - t
              - d
      responses:
        '200':
          description: 'List of matching ICD-10 codes'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IcdCode'
        '400':
          description: 'No search parameter provided'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  '/icd/{code}':
    get:
      tags:
        - ICD
      summary: 'Get a single ICD-10 code'
      description: 'GET /api/v2/icd/{code}[?language=en]'
      operationId: ef975394fee1e1eeff687f45983a5464
      parameters:
        -
          name: code
          in: path
          description: 'ICD-10 code (e.g. J06.9)'
          required: true
          schema:
            type: string
            example: J06.9
        -
          name: language
          in: query
          description: 'Language for description (default en)'
          schema:
            type: string
            default: en
            enum:
              - en
              - es
      responses:
        '200':
          description: 'ICD-10 code found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcdCode'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  '/patients/{id}':
    get:
      tags:
        - Patients
      summary: 'Get a patient by clinic patient ID'
      description: 'GET /api/v2/patients/{id}'
      operationId: 06f4b87d0bbad6970c1ecdae720c06ad
      parameters:
        -
          name: id
          in: path
          description: 'Clinic patient ID'
          required: true
          schema:
            type: string
            example: PT-001
      responses:
        '200':
          description: 'Patient found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    delete:
      tags:
        - Patients
      summary: 'Deactivate a patient record (soft delete)'
      description: 'DELETE /api/v2/patients/{id}'
      operationId: 8ac67c1ab23d4d0dc0efee5812fd6302
      parameters:
        -
          name: id
          in: path
          description: 'Clinic patient ID'
          required: true
          schema:
            type: string
            example: PT-001
      responses:
        '200':
          description: 'Patient deactivated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    patch:
      tags:
        - Patients
      summary: 'Update a patient record'
      description: 'PATCH /api/v2/patients/{id}'
      operationId: 955bfd7c530e2d796eda02975b408e5c
      parameters:
        -
          name: id
          in: path
          description: 'Clinic patient ID'
          required: true
          schema:
            type: string
            example: PT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: 'Patient updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /patients:
    get:
      tags:
        - Patients
      summary: 'Search patients'
      description: 'GET /api/v2/patients[?q=...&lastName=...&...]'
      operationId: c821f655dc528a33a47052b9ee8fc719
      parameters:
        -
          name: q
          in: query
          description: 'Free-text search across name fields'
          schema:
            type: string
        -
          name: lastName
          in: query
          description: 'Filter by last name'
          schema:
            type: string
        -
          name: firstName
          in: query
          description: 'Filter by first name'
          schema:
            type: string
        -
          name: clinicPatientID
          in: query
          description: 'Filter by clinic patient ID'
          schema:
            type: string
        -
          name: patientNationalID
          in: query
          description: 'Filter by national ID'
          schema:
            type: string
      responses:
        '200':
          description: 'List of matching patients'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          description: 'No search parameters provided'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    post:
      tags:
        - Patients
      summary: 'Create a new patient record'
      description: 'POST /api/v2/patients'
      operationId: 6d7f793f55aabb01a30eacfbe74637c2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '201':
          description: 'Patient created'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Patient' }
                type: object
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Patient ID already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  '/staff/{username}':
    get:
      tags:
        - Staff
      summary: 'Get a staff member by username'
      description: 'GET /api/v2/staff/{username}'
      operationId: 5f37cd7c22162968aeddb681c5a96e70
      parameters:
        -
          name: username
          in: path
          description: 'Staff username'
          required: true
          schema:
            type: string
            example: jsmith
      responses:
        '200':
          description: 'Staff member found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    delete:
      tags:
        - Staff
      summary: 'Deactivate a staff member (soft delete)'
      description: 'DELETE /api/v2/staff/{username}'
      operationId: 4f51158d1fbaaff49236773e612ff2cb
      parameters:
        -
          name: username
          in: path
          description: 'Staff username'
          required: true
          schema:
            type: string
            example: jsmith
      responses:
        '200':
          description: 'Staff member deactivated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    patch:
      tags:
        - Staff
      summary: 'Update a staff member'
      description: 'PATCH /api/v2/staff/{username}'
      operationId: 7d9247ab6ee8acd420fda5f4a56cdb4f
      parameters:
        -
          name: username
          in: path
          description: 'Staff username'
          required: true
          schema:
            type: string
            example: jsmith
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Staff'
      responses:
        '200':
          description: 'Staff member updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /staff:
    get:
      tags:
        - Staff
      summary: 'List staff members'
      description: 'GET /api/v2/staff[?position=...&active=...]'
      operationId: 0b7e92754fd8a2153d303118be964698
      parameters:
        -
          name: position
          in: query
          description: 'Filter by position'
          schema:
            type: string
            enum:
              - Nurse
              - NursesAid
              - NursingStudent
              - DoctorGeneral
              - DoctorSpecialist
              - MedicalStudent
              - ClinicStaff
              - Other
        -
          name: active
          in: query
          description: 'Filter by active status'
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
      responses:
        '200':
          description: 'List of staff'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
        '400':
          description: 'Invalid filter value'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    post:
      tags:
        - Staff
      summary: 'Create a new staff member'
      description: 'POST /api/v2/staff'
      operationId: 98fbe5bf1e97c6b69b13e10d9cfdaecc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - lastName
                - firstName
                - position
                - password
                - accessGranted
              properties:
                username:
                  type: string
                  example: jsmith
                lastName:
                  type: string
                  example: Smith
                firstName:
                  type: string
                  example: Jane
                position:
                  type: string
                  enum: [Nurse, NursesAid, NursingStudent, DoctorGeneral, DoctorSpecialist, MedicalStudent, ClinicStaff, Other]
                password:
                  type: string
                  format: password
                accessGranted:
                  type: string
                  enum: [SystemAdmin, ClinicAdmin, ClinicStaff, ClinicReadOnly]
              type: object
      responses:
        '201':
          description: 'Staff member created'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Staff' }
                type: object
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Username already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  '/visits/{id}':
    get:
      tags:
        - Visits
      summary: 'Get a visit by patient visit ID'
      description: 'GET /api/v2/visits/{id}'
      operationId: add7a01f20e636c8239bb8fba06054f4
      parameters:
        -
          name: id
          in: path
          description: 'Patient visit ID (22-character composite key)'
          required: true
          schema:
            type: string
            example: '000000000001202604010101'
      responses:
        '200':
          description: 'Visit found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    delete:
      tags:
        - Visits
      summary: 'Soft-delete a visit record'
      description: 'DELETE /api/v2/visits/{id}'
      operationId: f22ed3733d9f3d80fad9e39c63637da6
      parameters:
        -
          name: id
          in: path
          description: 'Patient visit ID'
          required: true
          schema:
            type: string
            example: '000000000001202604010101'
      responses:
        '200':
          description: 'Visit deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    patch:
      tags:
        - Visits
      summary: 'Update a visit record'
      description: 'PATCH /api/v2/visits/{id}'
      operationId: 28ce74237a44fde3117eefd2acd6e610
      parameters:
        -
          name: id
          in: path
          description: 'Patient visit ID'
          required: true
          schema:
            type: string
            example: '000000000001202604010101'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Visit'
      responses:
        '200':
          description: 'Visit updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
  /visits:
    get:
      tags:
        - Visits
      summary: 'Search visits by patient or status'
      description: 'GET /api/v2/visits?clinicPatientID=...&visitStatus=...'
      operationId: eb2eb81aedef0fe3653bc20fb8074676
      parameters:
        -
          name: clinicPatientID
          in: query
          description: 'Clinic patient ID'
          required: true
          schema:
            type: string
            example: PT-001
        -
          name: visitStatus
          in: query
          description: 'Filter by visit status'
          schema:
            type: string
            enum:
              - Open
              - Closed
              - Deleted
      responses:
        '200':
          description: 'List of visits'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
        '400':
          description: 'clinicPatientID is required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
    post:
      tags:
        - Visits
      summary: 'Open a new visit'
      description: 'POST /api/v2/visits'
      operationId: 5622df80f324ec7a70be3cc045d99652
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - clinicPatientID
                - visitType
              properties:
                clinicPatientID:
                  type: string
                  example: PT-001
                visitType:
                  type: string
                  example: Clinic
                dateTimeIn:
                  type: string
                  format: date-time
                staffUsername:
                  type: string
                  example: jsmith
                primaryComplaint:
                  type: string
              type: object
      responses:
        '201':
          description: 'Visit opened'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Visit' }
                type: object
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Patient not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          sessionToken: []
components:
  schemas:
    Clinic:
      required:
        - clinicID
        - thisClinic
      properties:
        clinicID:
          type: integer
          example: 1
        thisClinic:
          description: '1 if this is the local clinic record'
          type: integer
          example: 1
        publicID:
          type: string
          example: PUB001
          nullable: true
        typeCode:
          type: string
          nullable: true
        careLevel:
          type: string
          nullable: true
        longName:
          type: string
          example: 'Community Health Clinic'
          nullable: true
        shortName:
          type: string
          example: CHC
          nullable: true
        currency:
          type: string
          example: USD
          nullable: true
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        clinicNeighborhood:
          type: string
          nullable: true
        clinicCity:
          type: string
          nullable: true
        clinicState:
          type: string
